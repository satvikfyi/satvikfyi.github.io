# Quality gate for every push / PR to main.
#
# Deployment model (decision-log 18): the live site runs from its own
# repository, whose root holds the contents of this website build folder
# (delivered as <build>.zip from the satvikfyi_assets repo). There, this
# workflow sits at the repo root and runs as-is. The assets repo itself
# does not build or deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Build, types, links, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & schema check (astro check)
        run: npm run check

      - name: Build (includes the Pagefind indexing step)
        run: npm run build

      - name: Internal link check
        run: npm run check:links

      - name: Pagefind index check
        run: npm run check:search

      - name: SEO check (canonical, og:image, JSON-LD, robots, sitemap)
        run: npm run check:seo

      - name: Lighthouse CI (perf >= 0.9, a11y >= 0.95)
        run: npx --yes @lhci/cli@0.15 autorun
