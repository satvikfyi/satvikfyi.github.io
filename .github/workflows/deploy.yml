# Build and publish the site to GitHub Pages on every push to main.
#
# Deployment model (decision-log 18): the live site runs from its own
# repository, whose root holds the contents of this website build folder
# (delivered as <build>.zip from the satvikfyi_assets repo); there this
# workflow runs from the repo root as-is.
#
# Requires (one-time, in the live repo): Settings -> Pages -> Source set
# to "GitHub Actions". The CNAME file in public/ pins the custom domain
# satvik.fyi; DNS records are documented in
# docs/manual/03-deployment-and-troubleshooting.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (includes the Pagefind indexing step)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
