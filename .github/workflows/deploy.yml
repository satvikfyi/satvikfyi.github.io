# Build and publish the site to GitHub Pages on every push to main.
#
# Requires (one-time, per repository): Settings → Pages → Source set to
# "GitHub Actions". The CNAME file in public/ pins the custom domain
# satvik.fyi; point the domain's DNS at GitHub Pages as documented in
# docs/decision-log.md.
#
# NOTE: same repo-root caveat as ci.yml if this folder stays nested inside
# satvikfyi_assets — move to the repo root and set
# `working-directory: website/20260822` plus `path: website/20260822/dist`
# on the upload step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
